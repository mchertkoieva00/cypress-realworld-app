name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-jammy
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shards: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm install --force
          npm install -D allure-commandline  # Install allure locally instead of globally

      - name: Build app
        run: npm run build

      - name: Start app and run tests
        run: |
          npm start & npx wait-on http://localhost:3000
          npx playwright test \
            --shard=${{ matrix.shards }}/3 \
            --project=chromium \
            --reporter=list,allure-playwright

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results -o allure-report/shard-${{ matrix.shards }} --clean

      - name: Store reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Store traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-shard-${{ matrix.shards }}
          path: test-results
          retention-days: 7

  publish-report:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report